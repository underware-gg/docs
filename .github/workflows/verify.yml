name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install reviewed pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install reviewed Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce dependency-review policy
        env:
          DEPENDENCY_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$DEPENDENCY_REVIEW_BASE" ]; then
            pnpm run deps:policy:check -- --base "$DEPENDENCY_REVIEW_BASE"
          else
            pnpm run deps:policy:check
          fi

      - name: Reject critical advisories
        run: pnpm audit --audit-level critical

      - name: Type-check and build
        run: pnpm run verify
